<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otter Outfitters · Live architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f4f7ef;
      --paper-2: #e4ede4;
      --ink: #18383e;
      --muted: #486563;
      --rule: #bed0c5;
      --accent: #f6bc67;
      --accent-wash: #fff0d7;
      --font-sans: Inter, system-ui, sans-serif;
      --font-mono: "Roboto Mono", ui-monospace, monospace;
    }
    body { background: var(--paper); color: var(--ink); font-family: var(--font-sans); padding: 24px; }
    .frame { max-width: 1008px; margin: auto; }
    h1 { margin: 0 0 12px; font-size: 1.5rem; font-weight: 600; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    svg .paper { fill: var(--paper); }
    svg .rule { stroke: var(--rule); }
    svg .node { fill: var(--paper-2); stroke: var(--rule); }
    svg .focus { fill: var(--accent-wash); stroke: var(--accent); }
    svg .edge { fill: none; stroke: var(--muted); stroke-width: 1.6; }
    svg .handoff { stroke-dasharray: 4 3; stroke-width: 1.4; }
    svg .arrow { fill: var(--muted); }
    svg text { fill: var(--ink); font-family: var(--font-sans); }
    svg .heading { font-size: 26px; font-weight: 600; }
    svg .name { font-size: 18px; font-weight: 600; }
    svg .detail { font-size: 13px; fill: var(--muted); }
    svg .label { font-size: 12px; font-weight: 500; text-anchor: middle; }
    svg .mono { font-family: var(--font-mono); }
    svg .eyebrow { font-size: 11px; letter-spacing: 1.2px; fill: var(--muted); }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Otter Outfitters · Live architecture</h1>
    <div class="diagram-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="otter-architecture-title otter-architecture-desc">
        <title id="otter-architecture-title">Otter Outfitters live architecture</title>
        <desc id="otter-architecture-desc">The Next.js storefront and local AI SDK shopping agent call the Express API backed by Neon; Auth0 poppy-liendo authorizes the agent through a public HTTPS callback and loopback handoff, and Vercel AI Gateway supplies the model.</desc>
        <defs>
          <marker id="otter-architecture-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path class="arrow" d="M0 0L8 4L0 8Z"/>
          </marker>
        </defs>
        <rect class="paper" width="960" height="600" rx="18"/>
        <text class="eyebrow mono" x="48" y="36">OTTER OUTFITTERS  /  PHASE 2</text>
        <text class="heading" x="48" y="68">Live shopping architecture</text>

        <g marker-end="url(#otter-architecture-arrow)">
          <path class="edge" d="M240 140H384"/>
          <path class="edge" d="M576 140H720"/>
          <path class="edge" d="M144 172V288"/>
          <path class="edge handoff" d="M240 324H384"/>
          <path class="edge handoff" d="M576 324H720"/>
          <path class="edge" d="M816 288V236Q816 228 808 228H488Q480 228 480 220V172"/>
          <path class="edge handoff" d="M752 360V408Q752 416 744 416H152Q144 416 144 408V360"/>
          <path class="edge" d="M816 360V468"/>
        </g>

        <g>
          <rect class="paper" x="247" y="130" width="130" height="20"/>
          <text class="label" x="312" y="144">Cart, orders, activity</text>
          <rect class="paper" x="604" y="130" width="88" height="20"/>
          <text class="label" x="648" y="144">SQL</text>
          <rect class="paper" x="78" y="220" width="132" height="20"/>
          <text class="label" x="144" y="234">Customer sign-in</text>
          <rect class="paper" x="249" y="314" width="126" height="20"/>
          <text class="label" x="312" y="328">Browser redirect</text>
          <rect class="paper" x="585" y="314" width="126" height="20"/>
          <text class="label" x="648" y="328">Loopback handoff</text>
          <rect class="paper" x="565" y="218" width="166" height="20"/>
          <text class="label" x="648" y="232">Signed Poppy requests</text>
          <rect class="paper" x="345" y="406" width="206" height="20"/>
          <text class="label" x="448" y="420">Code exchange · PKCE</text>
          <rect class="paper" x="760" y="404" width="112" height="20"/>
          <text class="label" x="816" y="418">Model invocation</text>
        </g>

        <g>
          <rect class="node" x="48" y="100" width="192" height="72" rx="12"/>
          <text class="name" x="64" y="130">Storefront</text>
          <text class="detail" x="64" y="152">Next.js · Vercel</text>
          <rect class="node" x="384" y="100" width="192" height="72" rx="12"/>
          <text class="name" x="400" y="130">Carts API</text>
          <text class="detail" x="400" y="152">Express · Vercel</text>
          <rect class="node" x="720" y="100" width="192" height="72" rx="12"/>
          <text class="name" x="736" y="130">Neon</text>
          <text class="detail" x="736" y="152">Postgres persistence</text>

          <rect class="node" x="48" y="288" width="192" height="72" rx="12"/>
          <text class="name" x="64" y="316">Auth0</text>
          <text class="detail mono" x="64" y="340">poppy-liendo</text>
          <rect class="node focus" x="384" y="288" width="192" height="72" rx="12"/>
          <text class="name" x="400" y="316">HTTPS callback</text>
          <text class="detail mono" x="400" y="340">Vercel /callback</text>
          <rect class="node focus" x="720" y="288" width="192" height="72" rx="12"/>
          <text class="name" x="736" y="316">Shopping agent</text>
          <text class="detail" x="736" y="340">Local CLI runner · AI SDK</text>
          <rect class="node" x="720" y="468" width="192" height="72" rx="12"/>
          <text class="name" x="736" y="498">AI Gateway</text>
          <text class="detail" x="736" y="520">Vercel · Claude Haiku 4.5</text>
        </g>

        <path class="rule" d="M48 552H912"/>
        <path class="edge" d="M48 576H76"/>
        <text class="detail" x="84" y="580">Service request or sign-in</text>
        <path class="edge handoff" d="M300 576H328"/>
        <text class="detail" x="336" y="580">Agent approval callback and exchange</text>
      </svg>
    </div>
  </main>
</body>
</html>
